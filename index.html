<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>full song but ringtone 🤣</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>🎵 full song but ringtone 🤣</h1>
    <p>01:11 से शुरू • 02:00 पर अपने-आप रुकेगा</p>

    <audio id="audio" controls preload="metadata">
      <source src="new.song.mp3" type="audio/mpeg">
      आपका browser audio support नहीं करता।
    </audio>

    <button id="startBtn">▶️ 01:11 से चलाएँ</button>
    <button id="resetBtn">🔄 फिर से</button>
    <div id="status">Ready</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
